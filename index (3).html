function studentPage(){$('#content').innerHTML=`<div class="panel"><div class="toolbar"><input id="newname" placeholder="Nama peserta didik"><div class="actions"><button class="btn small" id="add">+ Tambah Peserta</button><button class="btn small" id="export">Ekspor CSV</button></div></div><div class="tablewrap"><table><thead><tr><th>No.</th><th>Nama peserta didik</th><th>Program</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint">Data disimpan di penyimpanan browser perangkat ini.</p></div>`;drawRows();$('#add').onclick=()=>{let n=$('#newname').value.trim();if(!n)return alert('Isi nama peserta didik.');students.push({name:n,program:'Belum ditentukan'});save();studentPage()};$('#export').onclick=()=>{let csv='Nama,Program\n'+students.map(s=>'"'+s.name.replaceAll('"','""')+'","'+s.program+'"').join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='data-peserta-pkbm.csv';a.click();URL.revokeObjectURL(a.href)}}
function drawRows(){let body=$('#rows');body.innerHTML=students.length?students.map((s,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.program)}</td><td><button class="btn small danger" data-del="${i}">Hapus</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada data peserta didik.</td></tr>';body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Hapus data ini?')){students.splice(+b.dataset.del,1);save();drawRows()}})}function save(){localStorage.setItem('pkbm_students',JSON.stringify(students))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
